def commonScriptsUrl = 'https://raw.githubusercontent.com/reportportal/gradle-scripts/'
def schemaUrl = 'https://schema.reportportal.io/'

project.ext {
    publishRepo = "https://maven.pkg.github.com/reportportal/service-api"
    dependencyRepos = ["commons-dao", "commons-rules", "commons-model", "commons", "commons-fonts", "plugin-api", "commons-bom"]
    limits = [
            'instruction': 70,
            'branch'     : 51,
            'line'       : 72,
            'complexity' : 60,
            'method'     : 65,
            'class'      : 90
    ]
    isDebugMode = System.getProperty("DEBUG", "false") == "true"
    releaseMode = project.hasProperty("releaseMode") ? project.releaseMode.toBoolean() : false
    scriptsUrl = commonScriptsUrl + (releaseMode ? '5.14.0' : 'develop')
    manifestSchemaUrl = schemaUrl + ('manifest.schema.json')
    excludeTests = ['**/entity/**',
                    '**/aop/**',
                    '**/jasper/**',
                    '**/configs/**',
                    '**/demodata/**',
                    '**/exception/**',
                    '**/job/FlushingDataJob**',
                    "**/core/analyzer/auto/client/model/**",
                    '**/core/analyzer/auto/impl/SuggestedItem**',
                    '**/core/item/impl/provider/impl/mock/**',
                    '**/model/**',
                    '**/api/**'
    ]
}
