plugins {
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'java-library'
    id 'org.owasp.dependencycheck' version '11.1.1'
    id 'org.springframework.boot' version "${springBootVersion}"
    id "com.epam.drill.integration.cicd" version "0.1.6"
    id "org.openapi.generator" version "7.11.0"
}

import org.owasp.dependencycheck.reporting.ReportGenerator

apply from: 'project-properties.gradle'
apply from: "$scriptsUrl/build-commons.gradle"
apply from: "$scriptsUrl/build-info.gradle"
apply from: "$scriptsUrl/release-service.gradle"
apply from: "$scriptsUrl/signing.gradle"
apply from: "$scriptsUrl/copy-database-scripts.gradle"

project.hasProperty('sealightsSession') && sealightsSession?.trim() ? apply(from: 'sealights.gradle') : println('No sealights session')

repositories {
    mavenCentral { url "https://repo1.maven.org/maven2" }
    maven { url 'https://jitpack.io' }
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext['spring-boot.version'] = "${springBootVersion}"
// Stay on Security 6.5.x (Boot 3.5). 6.5.11 is the last OSS patch (CVE-2026-47838 / X.509 impersonation).
ext['spring-security.version'] = '6.5.11'
// Jackson 2.21 LTS: 2.21.4+ critical databind/core, 2.21.5+ SSRF/mass-assignment, 2.21.6 latest patch.
// Do not jump to Jackson 3 (Boot 4).
ext['jackson-bom.version'] = '2.21.6'
// Latest Framework 6.2.x — remaining Spring CVE upgrades require Framework 7 / Boot 4.
ext['spring-framework.version'] = '6.2.19'
// Latest OSS 1.15.x. 1.15.13 is snapshot-only; 1.16.x is Boot 4.
ext['micrometer.version'] = '1.15.12'
// CVE-2020-29582: align kotlin stack to patched stdlib
ext['kotlin.version'] = '2.1.0'
// SNYK-JAVA-ORGSPRINGFRAMEWORKRETRY-17260993: resource allocation fixed in 2.0.13
ext['spring-retry.version'] = '2.0.13'
// 1.5.36+ Expression Injection; 1.5.37 full CVE-2026-13006. No Janino conditionals in logback-spring.xml.
ext['logback.version'] = '1.5.37'
// httpcore5-h2 HPACK DoS (CVE-2026-54428) fixed in 5.4.3+.
ext['httpcore5.version'] = '5.4.3'

// Transitive-security overrides until upstream BOMs/deps are bumped:
// - tika-core: commons-bom pins 1.28.x (vulnerable); require 3.2.2+ (CVE-2025-66516).
// - Netty: AWS SDK et al. pull mixed 4.1.x; align all io.netty artifacts to a patched release.
// - mchange-commons-java: Quartz 2.3.2 brings 0.2.15; force 0.4.0+ (CVE-2026-27727).
// - postgresql: SNYK-JAVA-ORGPOSTGRESQL-17874248 fixed in 42.7.12+.
// - parsson: SNYK-JAVA-ORGECLIPSEPARSSON-17817925 fixed in 1.1.8 (pulled by opensearch-java).
dependencyManagement {
    imports {
        mavenBom(releaseMode ? 'com.epam.reportportal:commons-bom:5.15.2' : 'com.github.reportportal:commons-bom:5.15.2')
        mavenBom('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.2.0')
        mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        // Win over springdoc/swagger/commons jackson-bom 2.19.x
        mavenBom('com.fasterxml.jackson:jackson-bom:2.21.6')
    }
    dependencies {
        dependency 'org.apache.tika:tika-core:3.2.2'
        dependency 'org.postgresql:postgresql:42.7.13'
        dependency 'org.eclipse.parsson:parsson:1.1.8'
        dependency 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    }
}

def secureNettyVersion = '4.1.135.Final'
configurations.configureEach {
    resolutionStrategy {
        force 'com.mchange:mchange-commons-java:0.4.0'
        force 'org.eclipse.parsson:parsson:1.1.8'
        force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
        force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        eachDependency { details ->
            if (details.requested.group == 'io.netty') {
                details.useVersion(secureNettyVersion)
            } else if (details.requested.group.startsWith('com.fasterxml.jackson')) {
                // annotations 2.21+ ship as 2.21 / 2.22 (no patch), unlike jackson-core/databind
                if (details.requested.name == 'jackson-annotations') {
                    details.useVersion('2.21')
                } else {
                    details.useVersion('2.21.6')
                }
            } else if (details.requested.group == 'org.springframework') {
                details.useVersion('6.2.19')
            } else if (details.requested.group == 'org.springframework.boot') {
                details.useVersion("${springBootVersion}")
            } else if (details.requested.group == 'org.springframework.security') {
                details.useVersion('6.5.11')
            } else if (details.requested.group == 'ch.qos.logback') {
                details.useVersion('1.5.37')
            }
        }
    }
}

println("Release mode: $releaseMode")
dependencies {
    implementation 'com.github.reportportal:commons:5.15.2'
    implementation 'com.github.reportportal:commons-dao:123253b'
    implementation('com.github.reportportal:plugin-api:5.15.0') {
        exclude group: 'com.github.reportportal', module: 'commons-dao'
        exclude group: 'com.github.reportportal', module: 'commons'
    }

    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    implementation 'org.opensearch.client:opensearch-java:3.2.0'
    implementation 'jakarta.json:jakarta.json-api:2.1.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springframework.security:spring-security-acl'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-oauth2-core'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework:spring-context-support'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // CVE-2025-70952 (Zip Slip in Unzip); transitive from commons was < 3.14.1
    implementation 'org.pf4j:pf4j:3.15.0'

    // Tomcat 11 embed trio aligned (Boot 3.5 BOM uses 10.1.x). 11.0.23+ patches embed-core CVEs on 11.0.22.
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
    implementation 'org.apache.tomcat.embed:tomcat-embed-el:11.0.25'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'

    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation "org.jooq:jooq:${jooqVersion}"

    // Optional for spring-boot-starter-amqp
    implementation "com.rabbitmq:http-client:5.3.0"
    implementation("org.apache.httpcomponents.client5:httpclient5:5.6.4") // gzip; 5.6.4 cert-validation / resource-lifetime CVEs

    // check authentication error response format for versions higher than 6.21.3
    implementation('net.sf.jasperreports:jasperreports:6.21.3') { //TODO: consider upgrade to 7.0.1+
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
    }
    // JasperReport's export to XLS uses Apache POI and openpdf for PDF export
    implementation 'org.apache.poi:poi:5.5.0'
    implementation 'com.github.librepdf:openpdf:2.4.0'

    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.2'

    implementation 'xerces:xercesImpl:2.12.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'com.google.api-client:google-api-client:2.8.1'

    implementation('commons-validator:commons-validator:1.10.0') {
        exclude group: 'commons-beanutils', module: 'commons-beanutils'
    }
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation "org.apache.jclouds.api:filesystem:${jcloudsVersion}"
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation "org.hibernate.validator:hibernate-validator:${hibernateValidatorVersion}"

    implementation 'com.networknt:json-schema-validator:1.5.6'

    implementation 'com.github.slugify:slugify:3.0.7'

    // add lombok support
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    //  Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-test'
    testImplementation 'org.flywaydb.flyway-test-extensions:flyway-spring-test:10.0.0'

    testImplementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    testImplementation 'io.jsonwebtoken:jjwt-jackson:0.12.5'
}

processResources {
    dependsOn(gitInfo)
    filesMatching('application.properties') {
        expand(project.properties)
    }
}

sourceSets {
    main {
        java {
            srcDirs "$buildDir/generated/src/main/java"
        }
    }
}

tasks.register('updateApiSubmodule', Exec) {
    commandLine 'git', 'submodule', 'update', '--init', "--recursive"
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.encoding = "UTF-8"
    options.compilerArgs << "-parameters"
    options.debug = true
    options.debugOptions.debugLevel = "source,lines,vars"
}

tasks.register('downloadManifestSchema') {
    doLast {
        def schemaDir = file("${projectDir}/src/main/resources/schema")
        schemaDir.mkdirs()

        def schemaUrl = new URI(manifestSchemaUrl).toURL()
        def fileName = schemaUrl.path.tokenize('/').last()
        def schemaFile = new File(schemaDir, fileName)

        schemaFile.withOutputStream { out ->
            out << schemaUrl.openStream()
        }
    }
}

dependencyCheck {
    formats = [ReportGenerator.Format.HTML, ReportGenerator.Format.XML]
//    cveValidForHours = 1
}

bootJar {
    duplicatesStrategy = duplicatesStrategy.EXCLUDE
    project.hasProperty('gcp') ? getArchiveFileName().set('app.jar') : archiveClassifier.set('' +
            'exec')
}
jar.enabled(true)
jar.archiveClassifier.set('')

test {
    dependsOn(copyTestDatabaseScripts)
    useJUnitPlatform()
    maxParallelForks = 1
    testLogging {
        events = ['failed']
        exceptionFormat = 'short'
    }
    reports {
        junitXml.required = true
    }
}

compileJava.dependsOn tasks.named('openApiGenerate')
compileJava.dependsOn tasks.named('downloadManifestSchema')
publish.dependsOn build
publish.mustRunAfter build
checkCommitNeeded.dependsOn removeScripts

//replaced with drill4j
//build.dependsOn jacocoTestReport

drill {
    groupId = "report-portal"
    appId = "service-api"
    packagePrefixes = ["com/epam/ta/reportportal"]
    enableTestAgent {
        enabled = System.getenv("DRILL_AGENT_ENABLED") == "true" ?: false
        version = "0.23.5"
    }
    enableAppAgent {
        enabled = System.getenv("DRILL_AGENT_ENABLED") == "true" ?: false
        version = "0.9.7"
    }
}

springBoot {
    buildInfo {
        properties {
            name = "API Service"
            version = "${project.version}"
            additional = [
                    "description": "$project.description",
                    "branch"     : getCurrentGitBranch(),
                    "repo"       : "reportportal/service-api"
            ]
            excludes = ['time', 'artifact']
        }
    }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/api-registry/api/openapi/reportportal-api.yaml"
    outputDir = "${layout.buildDirectory.get()}/generated"
    configFile = "$rootDir/src/main/resources/openapi/config.json"
    skipOverwrite = false
    cleanupOutput = true
}

tasks.preTagCommit.enabled = false
tasks.updateVersion.enabled = false
tasks.commitNewVersion.enabled = false
