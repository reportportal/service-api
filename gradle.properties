version=5.15.3
description=EPAM Report portal. Main API Service
dockerPrepareEnvironment=
dockerJavaOpts=-Xmx1g -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=70 -Djava.security.egd=file:/dev/./urandom
dockerJavaOptsDev=-DLOG_FILE=app.log \
                  -Xmx1g \
                  -XX:+UseG1GC \
                  -XX:+HeapDumpOnOutOfMemoryError \
                  -XX:HeapDumpPath=/tmp \
                  -XX:InitiatingHeapOccupancyPercent=70 \
                  -Djava.security.egd=file:/dev/./urandom \
                  -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
dockerServerUrl=unix:///var/run/docker.sock
org.gradle.jvmargs=-Xmx2048m
lombokVersion=1.18.42
# Keep in sync with commons-bom / commons-dao security pins (EPMRPP-118978).
springBootVersion=3.5.16
springFrameworkVersion=6.2.19
springSecurityVersion=6.5.11
jacksonVersion=2.21.6
logbackVersion=1.5.38
jooqVersion=3.19.18
hibernateValidatorVersion=8.0.5.Final
jcloudsVersion=2.7.0
httpcore5Version=5.4.3
