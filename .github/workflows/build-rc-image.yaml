name: Build RC Docker image

on:
  push:
    branches:
      - "rc/*"
      - "hotfix/*"
      # Unlike rc/* and hotfix/*, these builds never get the floating `latest` tag.
      - "patch/*"

jobs:
  variables-setup:
    name: Setting variables for docker build
    runs-on: ubuntu-latest
    environment: rc
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate patch branch name
        if: startsWith(github.ref_name, 'patch/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "${REF_NAME}" =~ ^patch/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Patch branch name must match 'patch/X.Y.Z', got '${REF_NAME}'"
            exit 1
          fi

      - name: Create variables
        id: vars
        run: |
          echo "version=$(echo '${{ github.ref_name }}' | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')" >> $GITHUB_OUTPUT
          echo "tag=$(echo ${{ github.ref_name }}-${{ github.run_number }} | tr '/' '-')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      date: ${{ steps.vars.outputs.date }}

  call-docker-build:
    name: Call release candidate Docker build
    needs: variables-setup
    uses: reportportal/.github/.github/workflows/build-docker-image.yaml@main
    with:
      aws-region: ${{ vars.AWS_REGION }}
      build-platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}
      image-tag: ${{ needs.variables-setup.outputs.tag }}
      release-mode: false
      # patch/*: no `latest`, only the commit sha tag, so the release step can find this exact image.
      # NOTE: keep `cond && value || fallback` with a truthy value; an empty string here would fall through to `latest`.
      additional-tag: ${{ startsWith(github.ref_name, 'patch/') && github.sha || 'latest' }}
      version: ${{ needs.variables-setup.outputs.version }}
      date: ${{ needs.variables-setup.outputs.date }}
      runs-on: ubuntu-latest
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
